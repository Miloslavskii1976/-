name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components (aidl)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          ls $ANDROID_HOME/build-tools/34.0.0 | grep aidl

      - name: Link buildozer SDK to system SDK
        run: |
          mkdir -p /home/runner/.buildozer/android/platform
          ln -sfn /usr/local/lib/android/sdk /home/runner/.buildozer/android/platform/android-sdk
          ls -la /home/runner/.buildozer/android/platform/

      - name: Install buildozer
        run: |
          pip install --upgrade pip virtualenv
          pip install buildozer cython==0.29.36

      - name: Build APK
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          which aidl
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
