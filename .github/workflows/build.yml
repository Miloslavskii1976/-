name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components (aidl + api 31)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-31" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Prepare buildozer Android SDK
        run: |
          SYS=/usr/local/lib/android/sdk
          BSD=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $BSD/tools/bin $BSD/cmdline-tools $BSD/build-tools $BSD/platform-tools $BSD/platforms
          ln -sfn $SYS/cmdline-tools/latest $BSD/cmdline-tools/latest
          ln -sfn $SYS/cmdline-tools/latest/bin/sdkmanager $BSD/tools/bin/sdkmanager
          ln -sfn $SYS/platform-tools $BSD/platform-tools
          ln -sfn $SYS/build-tools/34.0.0 $BSD/build-tools/34.0.0
          ln -sfn $SYS/platforms/android-31 $BSD/platforms/android-31
          ln -sfn $SYS/platforms/android-34 $BSD/platforms/android-34

      - name: Install latest buildozer from GitHub
        run: |
          pip install --upgrade pip virtualenv
          pip install -U git+https://github.com/kivy/buildozer.git
          pip install cython==0.29.36

      - name: Build APK (лог сохраняется в файл)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
      - name: Save last 150 log lines
        if: always()
        run: |
          tail -n 150 build_log.txt > error_tail.txt || true

      - name: Upload error tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-tail
          path: error_tail.txt
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
